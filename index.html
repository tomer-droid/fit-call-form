<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ebe2cc" />
<title>שאלות לקראת שיחת התאמה | Kamir Group</title>
<link rel="icon" href="assets/kamir-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ebe2cc;
    --bg-2:#f1e9d5;
    --surface:#faf4e4;
    --surface-2:#ffffff;
    --ink:#2b313c;
    --ink-2:#4a5160;
    --muted:#7d7868;
    --line:rgba(43,49,60,.10);
    --line-2:rgba(43,49,60,.16);
    --cream:#d9c29a;
    --gold:#a58348;
    --success:#1f5a4e;
    --danger:#b85c3e;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Assistant','Heebo',sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}

  /* Sticky progress */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(235,226,204,.92);backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid rgba(43,49,60,.06);}
  .topbar-inner{max-width:720px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;}
  .progress-bar{flex:1;height:6px;background:rgba(43,49,60,.10);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--cream));border-radius:999px;transition:width .55s cubic-bezier(.4,0,.2,1);}
  .progress-label{font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:.2px;white-space:nowrap;font-variant-numeric:tabular-nums;}

  .shell{max-width:720px;margin:0 auto;padding:28px 20px 56px;}

  /* Hero */
  .hero{text-align:center;padding:8px 6px 28px;}
  .logo{height:64px;width:auto;display:block;margin:0 auto 16px;filter:drop-shadow(0 6px 18px rgba(43,49,60,.18));}
  .brand-mark{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;background:rgba(165,131,72,.12);color:var(--gold);font-size:11.5px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:14px;}
  .brand-mark .dot{width:6px;height:6px;border-radius:999px;background:var(--gold);}
  h1.title{font-family:'Heebo','Assistant',sans-serif;font-weight:800;font-size:32px;line-height:1.2;margin:0 0 12px;letter-spacing:-.6px;}
  .sub{color:var(--ink-2);font-size:16px;line-height:1.65;margin:0 auto;max-width:520px;}
  .meta{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;}
  .meta .dot{width:4px;height:4px;border-radius:999px;background:var(--muted);}

  /* Question card */
  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 24px 22px;margin-bottom:16px;box-shadow:0 4px 16px rgba(43,49,60,.04);transition:box-shadow .25s ease, border-color .25s ease, transform .25s ease;scroll-margin-top:88px;}
  .qcard:focus-within{border-color:rgba(43,49,60,.28);box-shadow:0 12px 40px rgba(43,49,60,.10);}
  .qcard.answered{border-color:rgba(31,90,78,.25);background:linear-gradient(180deg,var(--surface) 0%,#f6f1de 100%);}
  .qcard.error{border-color:rgba(184,92,62,.55);box-shadow:0 0 0 3px rgba(184,92,62,.10);}
  @media(max-width:560px){.qcard{padding:20px 18px;border-radius:18px;}}

  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .qnum{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;flex-shrink:0;font-variant-numeric:tabular-nums;transition:background .25s ease;}
  .qcard.answered .qnum{background:var(--success);}
  .qnum-check{font-size:16px;line-height:1;}
  .qtitle{font-size:18.5px;font-weight:800;line-height:1.4;margin:0;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .qtitle .req{color:var(--danger);font-weight:800;margin-inline-start:2px;}
  .qtitle .opt-tag{font-size:11.5px;font-weight:700;color:var(--muted);background:rgba(125,120,104,.10);padding:3px 9px;border-radius:999px;letter-spacing:.2px;}

  /* Lighter look for open-ended (textarea) cards */
  .qcard.open-q{background:linear-gradient(180deg,#fdfaee 0%,var(--surface) 100%);border-color:rgba(43,49,60,.07);}
  .qcard.open-q .qnum{background:transparent;color:var(--gold);border:1.5px dashed rgba(165,131,72,.45);font-weight:700;}
  .qcard.open-q.answered .qnum{background:var(--success);color:#fff;border:none;}
  .qcard.open-q textarea{background:#fdfaee;border-color:rgba(43,49,60,.10);min-height:96px;border-radius:14px;}
  .qcard.open-q textarea:focus{background:#fff;}
  .qhelp{color:var(--muted);font-size:14px;line-height:1.55;margin:6px 0 14px;padding-inline-start:42px;}
  .qbody{padding-inline-start:42px;}
  @media(max-width:480px){.qhelp,.qbody{padding-inline-start:0;}}

  /* Inputs */
  input[type="text"],input[type="email"],textarea{
    width:100%;border:1.5px solid var(--line-2);background:var(--surface-2);
    border-radius:13px;padding:13px 16px;font:inherit;font-size:16px;color:var(--ink);
    outline:none;transition:border-color .15s,box-shadow .15s;
  }
  textarea{min-height:120px;resize:vertical;line-height:1.6;}
  input:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(43,49,60,.10);}
  input::placeholder,textarea::placeholder{color:#b3ad9c;}

  /* Radio cards */
  .options{display:grid;gap:9px;}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:13px;cursor:pointer;transition:all .15s ease;font-weight:600;font-size:15.5px;color:var(--ink);position:relative;user-select:none;}
  .opt:hover{border-color:var(--ink);transform:translateX(-2px);box-shadow:0 4px 14px rgba(43,49,60,.08);}
  .opt input{position:absolute;opacity:0;pointer-events:none;}
  .opt .dot{width:20px;height:20px;border-radius:999px;border:2px solid rgba(43,49,60,.28);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s ease;background:#fff;}
  .opt.selected{border-color:var(--ink);background:rgba(43,49,60,.05);box-shadow:0 0 0 2px rgba(43,49,60,.10);}
  .opt.selected .dot{border-color:var(--ink);background:var(--ink);}
  .opt.selected .dot::after{content:'';width:8px;height:8px;border-radius:999px;background:#fff;}

  /* Error message inside card */
  .qerror{margin-top:10px;color:var(--danger);font-size:13.5px;font-weight:700;display:none;}
  .qcard.error .qerror{display:block;}

  /* Submit */
  .submit-row{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .btn-submit{font:inherit;font-weight:800;font-size:17px;padding:16px 38px;border-radius:14px;border:none;cursor:pointer;background:var(--ink);color:#fff;transition:all .2s ease;display:inline-flex;align-items:center;gap:10px;letter-spacing:.3px;box-shadow:0 8px 24px rgba(43,49,60,.18);min-width:240px;justify-content:center;}
  .btn-submit:hover:not(:disabled){background:#1a1f28;transform:translateY(-1px);box-shadow:0 12px 32px rgba(43,49,60,.28);}
  .btn-submit:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
  .submit-hint{font-size:13px;color:var(--muted);text-align:center;}
  .submit-hint strong{color:var(--ink);font-weight:700;}

  /* Spinner */
  .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Global error */
  .global-error{display:none;background:rgba(184,92,62,.10);border:1px solid rgba(184,92,62,.4);color:var(--danger);padding:14px 16px;border-radius:12px;font-weight:600;font-size:14.5px;text-align:center;margin-top:14px;}
  .global-error.show{display:block;}
  .global-error a{color:var(--danger);font-weight:800;text-decoration:underline;}

  /* Success */
  .success{text-align:center;padding:48px 24px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 40px rgba(43,49,60,.06);animation:fadeIn .45s ease;}
  .check-circle{width:96px;height:96px;border-radius:999px;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:50px;font-weight:900;animation:pop .55s cubic-bezier(.2,1.4,.3,1);box-shadow:0 16px 36px rgba(31,90,78,.32);}
  @keyframes pop{0%{transform:scale(0);opacity:0;}60%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .success h2{font-size:28px;margin:0 0 12px;font-weight:800;}
  .success p{color:var(--ink-2);font-size:16px;line-height:1.65;margin:0 0 26px;max-width:460px;margin-inline:auto;}
  .home-link{display:inline-block;padding:13px 28px;background:var(--ink);color:#fff;border-radius:12px;text-decoration:none;font-weight:700;transition:all .2s;}
  .home-link:hover{background:#1a1f28;transform:translateY(-1px);}

  /* Footer */
  footer{margin-top:36px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.3px;}
  footer .divider{height:1px;width:48px;background:var(--gold);margin:0 auto 10px;opacity:.6;}

  /* Hidden helper */
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="topbar-inner">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 8</div>
  </div>
</div>

<div class="shell">

  <header class="hero" id="hero">
    <img src="assets/kamir-logo.png" alt="Kamir Group" class="logo" />
    <div class="brand-mark"><span class="dot"></span> Kamir Group</div>
    <h1 class="title">שאלות לקראת שיחת התאמה</h1>
    <p class="sub">כמה שאלות קצרות שיעזרו לי להגיע לשיחה מוכן.</p>
    <div class="meta">
      <span>⏱ כ-3 דקות</span>
      <span class="dot"></span>
      <span>שמירה אוטומטית</span>
    </div>
  </header>

  <form id="form" novalidate autocomplete="on">
    <!-- questions rendered here -->
  </form>

  <div class="submit-row" id="submitRow">
    <button type="button" class="btn-submit" id="submitBtn">
      שליחה <span aria-hidden="true">←</span>
    </button>
    <div class="submit-hint">השאלות הפתוחות אופציונליות, ענה על מה שמתחשק. <strong>נדבר בקרוב.</strong></div>
    <div class="global-error" id="globalError"></div>
  </div>

  <div id="successWrap" class="hidden"></div>

  <footer>
    <div class="divider"></div>
    Kamir Group · ליווי משקיעים ישראלים בנדל״ן בארה״ב
  </footer>
</div>

<script>
  // === CONFIG ===========================================================
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbIvqwb53dpgUnudbtL_PMqUpyaMGXR5oLk3lkeC6HX1pG5fuuthZc_ZU5SO6LjIkN/exec';
  const FALLBACK_EMAIL = 'tomer@shaykes.com';
  const STORAGE_KEY = 'fit-call-form-v2';

  // === QUESTIONS (verified from the live form) =========================
  const QUESTIONS = [
    { id:'name',  type:'text',  required:true,
      title:'שם מלא',
      placeholder:'שם פרטי ושם משפחה',
      autocomplete:'name' },

    { id:'email', type:'email', required:true,
      title:'כתובת אימייל',
      help:'יעזור לי לשלוח לך תזכורת לפני השיחה.',
      placeholder:'name@example.com',
      autocomplete:'email' },

    { id:'experience', type:'radio', required:true,
      title:'ניסיון בהשקעות',
      options:[
        'מחזיק בנדל״ן בישראל / בחו״ל',
        'משקיע בשוק ההון',
        'מטבעות קריפטו',
        'קופת גמל / קרן השתלמות',
        'לא משקיע בכלל',
        'אחר',
      ]},

    { id:'priority', type:'radio', required:true,
      title:'מה חשוב לך במיוחד בליווי',
      options:[
        'תהליך מסודר וברור',
        'שקיפות מלאה',
        'ליווי צמוד וזמינות מלאה לאורך כל הדרך',
        'חיסכון בזמן',
      ]},

    { id:'why_now', type:'textarea', required:false,
      title:'מה גורם לך לרצות להתחיל עכשיו ולא בעוד שנה?',
      placeholder:'אפשר במשפט או שניים, מה הדחיפות / ההזדמנות שאתה רואה.' },

    { id:'focus', type:'textarea', required:false,
      title:'על מה תרצה שנשים דגש בשיחה שלנו?',
      placeholder:'נושאים, סוגיות, או שאלות שחשוב לך לכסות.' },

    { id:'budget', type:'radio', required:true,
      title:'טווח השקעה מוערך להתחלה',
      options:[
        '60,000$ - 80,000$',
        '80,000$ - 120,000$',
        '120,000$+',
        'עוד לא החלטתי / צריך להבין את זה בשיחה',
      ]},

    { id:'success', type:'textarea', required:false,
      title:'אם נצא לדרך, מה ייחשב מבחינתך הצלחה בתהליך?',
      placeholder:'איך תיראה התוצאה שתגרום לך לומר ״הצליח״.' },
  ];

  // === STATE ============================================================
  let answers = {};
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && typeof saved === 'object') answers = saved;
  }catch{}

  // === RENDER ===========================================================
  const form = document.getElementById('form');
  form.innerHTML = QUESTIONS.map((q, i) => renderCard(q, i+1)).join('');

  function renderCard(q, idx){
    const val = answers[q.id] ?? '';
    const isOpen = q.type === 'textarea';
    const classes = ['qcard'];
    if (val) classes.push('answered');
    if (isOpen) classes.push('open-q');
    const tag = q.required
      ? '<span class="req">*</span>'
      : (isOpen ? '<span class="opt-tag">אופציונלי</span>' : '');
    return `
      <section class="${classes.join(' ')}" id="card-${q.id}" data-id="${q.id}">
        <div class="qhead">
          <span class="qnum" id="num-${q.id}">${val ? '<span class="qnum-check">✓</span>' : idx}</span>
          <h2 class="qtitle"><span>${q.title}</span>${tag}</h2>
        </div>
        ${q.help ? `<p class="qhelp">${q.help}</p>` : ''}
        <div class="qbody">${renderInput(q, val)}</div>
        <div class="qerror" id="err-${q.id}"></div>
      </section>
    `;
  }

  function renderInput(q, value){
    if (q.type === 'text' || q.type === 'email'){
      return `<input id="inp-${q.id}" type="${q.type==='email'?'email':'text'}" name="${q.id}" placeholder="${q.placeholder||''}" value="${escapeAttr(value)}" autocomplete="${q.autocomplete||'on'}" data-q="${q.id}" />`;
    }
    if (q.type === 'textarea'){
      return `<textarea id="inp-${q.id}" name="${q.id}" placeholder="${q.placeholder||''}" data-q="${q.id}">${escapeHtml(value)}</textarea>`;
    }
    if (q.type === 'radio'){
      return `<div class="options" id="opts-${q.id}" role="radiogroup" aria-label="${escapeAttr(q.title)}">
        ${q.options.map(opt => {
          const sel = value === opt ? 'selected' : '';
          return `<label class="opt ${sel}" data-q="${q.id}" data-val="${escapeAttr(opt)}" tabindex="0">
            <span class="dot" aria-hidden="true"></span>
            <span>${escapeHtml(opt)}</span>
          </label>`;
        }).join('')}
      </div>`;
    }
    return '';
  }

  // === EVENTS ===========================================================
  form.addEventListener('input', (e) => {
    const t = e.target;
    const qid = t.dataset.q;
    if (!qid) return;
    setAnswer(qid, t.value);
  });

  form.addEventListener('click', (e) => {
    const lbl = e.target.closest('.opt');
    if (!lbl) return;
    const qid = lbl.dataset.q;
    setAnswer(qid, lbl.dataset.val);
    const opts = document.getElementById('opts-' + qid);
    opts.querySelectorAll('.opt').forEach(o => o.classList.toggle('selected', o === lbl));
  });

  form.addEventListener('keydown', (e) => {
    if (e.target.classList.contains('opt') && (e.key === ' ' || e.key === 'Enter')){
      e.preventDefault();
      e.target.click();
    }
  });

  function setAnswer(qid, val){
    answers[qid] = val;
    persist();
    const card = document.getElementById('card-' + qid);
    const num  = document.getElementById('num-' + qid);
    const idx  = QUESTIONS.findIndex(q => q.id === qid) + 1;
    if (val){
      card.classList.add('answered');
      card.classList.remove('error');
      const errEl = document.getElementById('err-' + qid);
      if (errEl) errEl.textContent = '';
      num.innerHTML = '<span class="qnum-check">✓</span>';
    } else {
      card.classList.remove('answered');
      num.textContent = idx;
    }
    updateProgress();
  }

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); }catch{}
  }

  function updateProgress(){
    const required = QUESTIONS.filter(q => q.required);
    const done = required.filter(q => (answers[q.id] || '').toString().trim()).length;
    const pct  = Math.round((done / required.length) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = done + ' / ' + required.length;
  }

  // === VALIDATE / SUBMIT ===============================================
  document.getElementById('submitBtn').addEventListener('click', submit);

  function validate(){
    let firstBad = null;
    QUESTIONS.forEach(q => {
      const card = document.getElementById('card-' + q.id);
      const errEl = document.getElementById('err-' + q.id);
      const v = (answers[q.id] || '').toString().trim();
      let msg = null;
      if (q.required && !v) msg = 'תשובה נדרשת.';
      else if (q.type === 'email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = 'כתובת המייל לא נראית תקינה.';
      if (msg){
        card.classList.add('error');
        errEl.textContent = msg;
        if (!firstBad) firstBad = card;
      } else {
        card.classList.remove('error');
        errEl.textContent = '';
      }
    });
    return firstBad;
  }

  async function submit(){
    const globalErr = document.getElementById('globalError');
    globalErr.classList.remove('show');

    const firstBad = validate();
    if (firstBad){
      firstBad.scrollIntoView({behavior:'smooth', block:'center'});
      const inp = firstBad.querySelector('input,textarea,.opt');
      if (inp && inp.focus) setTimeout(() => inp.focus(), 350);
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> שולח...';

    const payload = { ...answers, source:'fit-call-form', userAgent:navigator.userAgent };

    try{
      if (!SCRIPT_URL || SCRIPT_URL.startsWith('PASTE_')){
        console.log('[fit-call-form] would POST:', payload);
        await new Promise(r => setTimeout(r, 600));
      } else {
        const res = await fetch(SCRIPT_URL, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({ok:false}));
        if (!data.ok) throw new Error(data.error || 'submit_failed');
      }
      try{ localStorage.removeItem(STORAGE_KEY); }catch{}
      showSuccess(answers.name);
    }catch(err){
      console.error(err);
      btn.disabled = false;
      btn.innerHTML = 'נסה שוב <span aria-hidden="true">←</span>';
      globalErr.innerHTML = 'משהו השתבש בשליחה. נסה שוב, או כתוב לי ל-<a href="mailto:' + FALLBACK_EMAIL + '">' + FALLBACK_EMAIL + '</a>';
      globalErr.classList.add('show');
    }
  }

  function showSuccess(name){
    const first = (name || '').toString().trim().split(/\s+/)[0];
    document.getElementById('form').classList.add('hidden');
    document.getElementById('submitRow').classList.add('hidden');
    document.getElementById('topbar').classList.add('hidden');
    const wrap = document.getElementById('successWrap');
    wrap.classList.remove('hidden');
    wrap.innerHTML = `
      <div class="success">
        <div class="check-circle">✓</div>
        <h2>${first ? 'תודה ' + escapeHtml(first) + '!' : 'תודה רבה!'}</h2>
        <p>קיבלתי את התשובות שלך. אקרא אותן לפני השיחה כדי שנגיע ממוקדים, נדבר בקרוב.</p>
      </div>
    `;
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // === UTIL =============================================================
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  // === BOOT =============================================================
  updateProgress();
</script>
